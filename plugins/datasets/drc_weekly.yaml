- id: chirps3_precipitation_weekly
  name: Weekly precipitation total (CHIRPS3)
  short_name: Weekly precipitation
  description: Seven-day CHIRPS3 precipitation total for complete ISO weeks.
  standard_name: lwe_thickness_of_precipitation_amount
  variable: precip
  period_type: weekly
  sync: {kind: temporal, execution: append}
  extents:
    spatial: {bbox: [-180, -50, 180, 50]}
    temporal: {begin: "1981-01-05", resolution: P1W}
  ingestion:
    plugin: datasets.drc_weekly.CHIRPS3PrecipitationWeeklyPlugin
  units: mm
  cell_methods: "time: sum"
  resolution: 5 km x 5 km
  source: CHIRPS v3 daily
  source_url: https://www.chc.ucsb.edu/data/chirps3
  license: CC-BY-4.0
  providers:
    - {name: UCSB Climate Hazards Center, url: https://www.chc.ucsb.edu/data/chirps}
  display: {colormap: blues, range: [0.0, 140.0], nodata: -9999.0}

- id: era5land_precipitation_weekly
  name: Weekly precipitation total (ERA5-Land)
  short_name: Weekly precipitation
  description: Seven-day ERA5-Land precipitation total for complete ISO weeks.
  standard_name: lwe_thickness_of_precipitation_amount
  variable: tp
  period_type: weekly
  sync: {kind: temporal, execution: append}
  extents:
    spatial: {bbox: [-180, -90, 180, 90]}
    temporal: {begin: "1950-01-02", resolution: P1W}
  ingestion:
    plugin: datasets.drc_weekly.ERA5LandPrecipitationWeeklyPlugin
  units: mm
  cell_methods: "time: sum"
  resolution: 9 km x 9 km
  source: ERA5-Land Reanalysis
  source_url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land
  license: {name: Licence to Use Copernicus Products, url: https://apps.ecmwf.int/datasets/licences/copernicus/}
  providers: &copernicus_provider
    - {name: Copernicus Climate Change Service (C3S), url: https://climate.copernicus.eu/}
  display: {colormap: blues, range: [0.0, 140.0], nodata: -9999.0}


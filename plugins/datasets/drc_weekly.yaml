    plugin: datasets.drc_weekly.ERA5LandTemperatureWeeklyPlugin
  units: degC
  cell_methods: "time: mean"
  resolution: 9 km x 9 km
  source: ERA5-Land Reanalysis
  source_url: https://cds.climate.copernicus.eu/datasets/derived-era5-land-daily-statistics
  license: &copernicus_license {name: Licence to Use Copernicus Products, url: https://apps.ecmwf.int/datasets/licences/copernicus/}
  providers: *copernicus_provider
  display: &temperature_display {colormap: rdbu_r, range: [-30.0, 50.0], nodata: -9999.0}


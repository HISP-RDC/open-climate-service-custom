  units: "1"
  cell_methods: "time: mean"
  resolution: 0.01 degree x 0.01 degree
  source: MODIS MOD13A1.061 via Microsoft Planetary Computer
  source_url: https://planetarycomputer.microsoft.com/dataset/modis-13A1-061
  license: CC0-1.0
  providers: *modis_providers
  display: *vegetation_display

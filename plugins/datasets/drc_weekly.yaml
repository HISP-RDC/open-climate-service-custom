- id: modis_ndvi_weekly
  name: Weekly NDVI (MODIS Terra)
  short_name: NDVI
  description: >-
    Weekly NDVI derived from Terra MOD13A1 16-day composites. Overlapping composites are
    weighted by their number of days in the ISO week and resampled to 0.01 degrees.
  variable: ndvi
  period_type: weekly
  sync: {kind: temporal, execution: append}
  extents:
    spatial: {bbox: [-180, -90, 180, 90]}
    temporal: {begin: "2000-02-21", resolution: P1W}
  ingestion:
    plugin: datasets.drc_weekly.MODISVegetationWeeklyPlugin
    params: {index: ndvi, resolution_degrees: 0.01}
  units: "1"
  cell_methods: "time: mean"
  resolution: 0.01 degree x 0.01 degree
  source: MODIS MOD13A1.061 via Microsoft Planetary Computer
  source_url: https://planetarycomputer.microsoft.com/dataset/modis-13A1-061
  license: CC0-1.0
  providers: &modis_providers
    - {name: NASA LP DAAC, url: https://lpdaac.usgs.gov/products/mod13a1v061/}
    - {name: Microsoft Planetary Computer, url: https://planetarycomputer.microsoft.com/}
  display: &vegetation_display {colormap: YlGn, range: [-0.2, 1.0], nodata: -9999.0}

- id: modis_evi_weekly
  name: Weekly EVI (MODIS Terra)
  short_name: EVI
